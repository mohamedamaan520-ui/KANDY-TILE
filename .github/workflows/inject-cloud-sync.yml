name: Connect KANDY TILE Cloud Sync
on:
  push:
    branches: [main]
    paths:
      - "cloud-sync.js"
      - "index.html"
      - ".github/workflows/inject-cloud-sync.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject-cloud-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connect Supabase client to website
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          version = "20261118-png-cloud-upload-fix-1"
          needle = 'src="cloud-sync.js"'
          if needle in s:
              s = s.replace(needle, 'src="cloud-sync.js?v=' + version + '"', 1)
              print("Cloud sync script cache version updated.")
          elif 'cloud-sync.js?v=' in s:
              import re
              s = re.sub(r'src="cloud-sync\.js(?:\?[^"]*)?"', 'src="cloud-sync.js?v=' + version + '"', s, count=1)
              print("Cloud sync script cache version refreshed.")
          else:
              marker = "</script></body></html>"
              if marker not in s:
                  raise SystemExit("Could not find safe insertion point in index.html.")
              replacement = '</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-sync.js?v=' + version + '"></script></body></html>'
              s = s.replace(marker, replacement, 1)
              print("Supabase JS and cloud-sync.js connected.")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Diagnose legacy image upload paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          terms = ["storage.from(", ".upload(", "catalog-photos", "FileReader", "readAsDataURL", "image/png"]
          for term in terms:
              print("\\n=== " + term + " ===")
              pos = 0
              count = 0
              while True:
                  pos = s.find(term, pos)
                  if pos < 0 or count >= 12: break
                  print(s[max(0,pos-450):min(len(s),pos+900)].replace("\\n"," ")[:1400])
                  pos += len(term)
                  count += 1
          PY
      - name: Validate and commit
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Connect KANDY TILE website to Supabase cloud sync"
            git push
          else
            echo "No index changes needed."
          fi
