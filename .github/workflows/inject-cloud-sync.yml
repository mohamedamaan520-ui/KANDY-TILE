name: Connect KANDY TILE Cloud Sync
on:
  push:
    branches: [main]
    paths:
      - "cloud-sync.js"
      - "index.html"
      - ".github/workflows/inject-cloud-sync.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject-cloud-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connect Supabase client to website
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'src="cloud-sync.js"' in s:
              print("Cloud sync script is already connected.")
          else:
              marker = "</script></body></html>"
              if marker not in s:
                  raise SystemExit("Could not find the safe insertion point in index.html; no changes made.")
              replacement = '</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-sync.js"></script></body></html>'
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding="utf-8")
              print("Supabase JS and cloud-sync.js connected.")
          PY
      - name: Validate and commit
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Connect KANDY TILE website to Supabase cloud sync"
            git push
          else
            echo "No index changes needed."
          fi
