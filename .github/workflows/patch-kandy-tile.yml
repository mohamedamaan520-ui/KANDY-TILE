name: Apply Kandy Tile category and slideshow update
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-kandy-tile.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply requested changes
        run: python tools/patch-kandy-tile.py
      - name: Commit updated catalogue and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm tools/patch-kandy-tile.py .github/workflows/patch-kandy-tile.yml
          git commit -m "Add category management and rotating tile slideshow"
          git push
